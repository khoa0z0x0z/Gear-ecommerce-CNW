  <div class="sidebar-top">
    <h1 class="dashboard-title">Admin<br>Dashboard</h1>

    <nav class="sidebar-menu">
      <a class="menu-item" routerLink="/admin" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <span class="menu-icon">📦</span>
        <span>Products</span>
      </a>

      <a class="menu-item" routerLink="/admin/orders" routerLinkActive="active">

        <span>Orders</span>

        <span>Customers</span>

      <a class="menu-item" routerLink="/admin/stats" routerLinkActive="active">
        <span class="menu-icon">📊</span>

      <a class="menu-item" routerLink="/admin/settings" routerLinkActive="active">
        <span class="menu-icon">⚙️</span>
        <span>Settings</span>

        <span>Coupons</span>
      </a>

      <a class="menu-item" routerLink="/admin/notifications" routerLinkActive="active">
        <span class="menu-icon">🔔</span>
        <span>Notifications</span>
      </a>
