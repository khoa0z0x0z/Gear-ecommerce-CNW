<header class="main-header">
  <div class="logo">KAT</div>

  <nav class="nav-links">
    <a routerLink="/">Home</a>
    <a routerLink="/contact">Contact</a>
    <a routerLink="/about">About</a>
    
    <a *ngIf="!isLoggedIn()" routerLink="/register">Sign Up</a>
  </nav>

  <div class="nav-actions">
    <div class="search-box">
      <input type="text" placeholder="What are you looking for?">
      <button class="search-icon">🔍</button>
    </div>

    <div class="user-area" *ngIf="isLoggedIn()">
      <a routerLink="/wishlist" class="icon-btn" style="position: relative; margin-right: 15px;">
        ❤️
        <span *ngIf="wishlistCount() > 0" style="position: absolute; top: -5px; right: -10px; background: #db4444; color: white; font-size: 10px; width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
          {{ wishlistCount() }}
        </span>
      </a>

      <a routerLink="/cart" class="icon-btn" style="position: relative; margin-right: 15px;">
        🛒
        <span *ngIf="cartCount() > 0" style="position: absolute; top: -5px; right: -10px; background: #db4444; color: white; font-size: 10px; width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
          {{ cartCount() }}
        </span>
      </a>
      
      <div class="avatar-container">
        <button class="icon-btn avatar-btn" (click)="toggleDropdown()">👤</button>
        
        <div class="dropdown-menu" *ngIf="showDropdown">
          <a routerLink="/profile" (click)="toggleDropdown()">👤 Manage My Account</a>
          <a routerLink="/order-history" (click)="toggleDropdown()">🛍️ My Order</a>
          <a (click)="logout()">🚪 Logout</a>
        </div>
      </div>
    </div>
    
    <a *ngIf="!isLoggedIn()" routerLink="/login" style="text-decoration: none; color: #111; font-weight: 500;">Login</a>
  </div>
</header>
