<div class="profile-container">
  <div class="breadcrumb">
    <a routerLink="/">Home</a> / <span>My Account</span>
  </div>

  <div class="profile-layout" *ngIf="!isLoading()">
    <!-- Sidebar -->
    <aside class="sidebar">
      <h3>Manage My Account</h3>
      <ul>
        <li class="active">My Profile</li>
        <li>Address Book</li>
        <li>My Payment Options</li>
      </ul>

      <h3>My Orders</h3>
      <ul>
        <li><a routerLink="/orders">My Orders</a></li>
        <li><a routerLink="/orders">My Returns</a></li>
        <li><a routerLink="/orders">My Cancellations</a></li>
      </ul>

      <h3><a routerLink="/wishlist" style="text-decoration: none; color: inherit;">My Wishlist</a></h3>
    </aside>

    <!-- Main Content -->
    <main class="content">
      <h2 class="text-danger">Edit Your Profile</h2>

      <form class="profile-form" (ngSubmit)="saveChanges()">
        <div class="form-row">
          <div class="form-group">
            <label>First Name</label>
            <input type="text" [(ngModel)]="editData.firstName" name="firstName" placeholder="First Name">
          </div>
          <div class="form-group">
            <label>Last Name</label>
            <input type="text" [(ngModel)]="editData.lastName" name="lastName" placeholder="Last Name">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Email</label>
            <input type="email" [(ngModel)]="editData.email" name="email" placeholder="Email">
          </div>
          <div class="form-group">
            <label>Phone</label>
            <input type="text" [(ngModel)]="editData.phone" name="phone" placeholder="Phone Number">
          </div>
        </div>

        <h3 class="password-title">Password Changes</h3>
        <div class="form-group">
          <input type="password" [(ngModel)]="editData.currentPassword" name="currentPassword" placeholder="Current Password">
        </div>
        <div class="form-group">
          <input type="password" [(ngModel)]="editData.newPassword" name="newPassword" placeholder="New Password">
        </div>
        <div class="form-group">
          <input type="password" [(ngModel)]="editData.confirmPassword" name="confirmPassword" placeholder="Confirm New Password">
        </div>

        <div class="form-actions">
          <button type="button" class="btn-cancel" (click)="cancel()">Cancel</button>
          <button type="submit" class="btn-save">Save Changes</button>
        </div>
      </form>
    </main>
  </div>
  <div *ngIf="isLoading()" style="padding: 50px; text-align: center;">
    Loading profile...
  </div>
</div>
