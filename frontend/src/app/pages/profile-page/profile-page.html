<div class="container profile-container">
  <!-- Breadcrumb -->
  <nav aria-label="breadcrumb" class="mb-5">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a routerLink="/">Home</a></li>
      <li class="breadcrumb-item active" aria-current="page">My Account</li>
    </ol>
  </nav>

  <div class="account-frame">
    <div class="row g-0">
      <!-- Sidebar Column -->
      <div class="col-md-3 border-end">
        <div class="sidebar-padding">
          <app-user-sidebar></app-user-sidebar>
        </div>
      </div>
      
      <!-- Content Column -->
      <div class="col-md-9">
        <div class="content-padding">
          <div class="profile-content">
            <h2 class="card-title">Edit Your Profile</h2>
            
            <div *ngIf="message()" [class.alert]="true" [class.alert-success]="!isError()" [class.alert-danger]="isError()" class="custom-alert">
              <i class="bi" [class.bi-check-circle]="!isError()" [class.bi-exclamation-triangle]="isError()"></i>
              {{ message() }}
            </div>

            <form (ngSubmit)="onSubmit()" #profileForm="ngForm" class="profile-form">
              <div class="row g-4 mb-4">
                <div class="col-md-6">
                  <div class="form-floating">
                    <input type="text" class="form-control" id="fullName" name="fullName" [(ngModel)]="fullName" placeholder="Full Name" required>
                    <label for="fullName">Full Name</label>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-floating">
                    <input type="text" class="form-control" id="phone" name="phone" [(ngModel)]="phone" placeholder="Phone Number">
                    <label for="phone">Phone Number</label>
                  </div>
                </div>
              </div>

              <div class="mb-4">
                <div class="form-floating">
                  <input type="email" class="form-control" id="email" [value]="profile()?.email" disabled placeholder="Email">
                  <label for="email">Email (Read-only)</label>
                </div>
              </div>

              <div class="password-divider mt-5 mb-4">
                <span>Password Changes</span>
              </div>

              <div class="row g-3">
                <div class="col-12">
                  <div class="form-floating">
                    <input type="password" class="form-control" id="currentPassword" name="currentPassword" [(ngModel)]="currentPassword" placeholder="Current Password">
                    <label for="currentPassword">Current Password</label>
                  </div>
                </div>
                
                <div class="col-md-6">
                  <div class="form-floating">
                    <input type="password" class="form-control" id="newPassword" name="newPassword" [(ngModel)]="newPassword" placeholder="New Password">
                    <label for="newPassword">New Password</label>
                  </div>
                </div>
                
                <div class="col-md-6">
                  <div class="form-floating">
                    <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" [(ngModel)]="confirmPassword" placeholder="Confirm Password">
                    <label for="confirmPassword">Confirm New Password</label>
                  </div>
                </div>
              </div>

              <div class="form-actions d-flex justify-content-end gap-3 mt-5">
                <button type="button" class="btn btn-cancel" (click)="loadProfile()">Cancel</button>
                <button type="submit" class="btn btn-save">Save Changes</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
