<section class="admin-dashboard-page">
  
  <aside class="admin-sidebar">
    <div class="sidebar-top">
      <h1 class="dashboard-title">Admin<br>Dashboard</h1>

      <nav class="sidebar-menu">
        <a class="menu-item" routerLink="/admin" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
          <span class="menu-icon">📦</span>
          <span>Products</span>
        </a>

        <a class="menu-item" routerLink="/admin/customers" routerLinkActive="active">
          <span class="menu-icon">👥</span>
          <span>Customers</span>
        </a>

        <a class="menu-item" routerLink="/admin/settings" routerLinkActive="active">
          <span class="menu-icon">⚙️</span>
          <span>Settings</span>
        </a>
      </nav>
    </div>

    <button class="logout-btn" type="button" (click)="logout()">
      <span>↩</span>
      <span>Logout</span>
    </button>
  </aside>

  <main class="admin-main">
    <section class="admin-content">
      
      <div class="content-header">
        <div>
          <h2>Products</h2>
          <p>Manage your product catalog</p>
        </div>
        <button class="add-product-btn" (click)="goAddProduct()">
          Add Product
        </button>
      </div>

      <div class="filter-card">
        <div class="filter-title-row">
          <div class="filter-title-left">
            <span class="filter-icon">⚙️</span>
            <span class="filter-title">Filters:</span>
          </div>
        </div>

        <div class="filter-row">
          <select class="filter-btn" [value]="selectedCategory" (change)="selectedCategory = $any($event.target).value">
            <option value="all">Category: All</option>
            <option value="Phone">Phone</option>
            <option value="Laptop">Laptop</option>
            <option value="Tablet">Tablet</option>
          </select>

          <select class="filter-btn" [value]="selectedPriceRange" (change)="selectedPriceRange = $any($event.target).value">
            <option value="all">Price: All</option>
            <option value="under-25m">Under 25M</option>
            <option value="25m-30m">25M - 30M</option>
            <option value="over-30m">Over 30M</option>
          </select>

          <select class="filter-btn" [value]="selectedStatus" (change)="selectedStatus = $any($event.target).value">
            <option value="all">Status: All</option>
            <option value="Active">Active</option>
            <option value="Out of stock">Out of stock</option>
          </select>

          <select class="filter-btn" [value]="selectedSort" (change)="selectedSort = $any($event.target).value">
            <option value="sold-desc">Sort: Best selling</option>
            <option value="price-asc">Sort: Price low to high</option>
            <option value="price-desc">Sort: Price high to low</option>
          </select>

          <button class="filter-btn" type="button" (click)="resetFilters()">Reset</button>
        </div>
      </div>

      <div class="admin-product-grid">
        <div class="admin-product-card" *ngFor="let product of filteredProducts">
          <div class="admin-product-image">
            <img [src]="product.image" [alt]="product.name" />
          </div>

          <div class="admin-product-info">
            <h3>{{ product.name }}</h3>
            <p class="sold-text">{{ product.sold }} sold</p>

            <div class="product-bottom">
              <span class="price">{{ product.price }}</span>
              <button type="button" class="edit-btn" (click)="editProduct(product.name)">
                Edit
              </button>
            </div>
          </div>
        </div>
      </div>

      <p class="empty-state" *ngIf="filteredProducts.length === 0">No products match the current filters.</p>

    </section>
  </main>

</section>
