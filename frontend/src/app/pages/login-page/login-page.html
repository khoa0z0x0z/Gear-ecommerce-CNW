<section class="login-page">
  <div class="login-wrapper">
    <div class="login-left">
      <div class="login-image-placeholder">
        <div class="screen-card one"></div>
        <div class="screen-card two"></div>
        <div class="screen-card three"></div>
      </div>
    </div>

    <div class="login-right">
      <h1>Log in to Exclusive</h1>
      <p class="login-subtitle">Enter your details below</p>

      <div class="error-alert" *ngIf="errorMessage">
        ⚠️ {{ errorMessage }}
      </div>

      <form class="login-form" [formGroup]="loginForm" (ngSubmit)="handleLogin()">
        <div class="form-group">
          <input
            type="email"
            placeholder="Email *"
            formControlName="email"
            [class.error-border]="isInvalid('email')"
          />
          <span class="error-msg" *ngIf="isInvalid('email')">Please enter a valid email</span>
        </div>

        <div class="form-group">
          <input
            type="password"
            placeholder="Password *"
            formControlName="password"
            [class.error-border]="isInvalid('password')"
          />
          <span class="error-msg" *ngIf="isInvalid('password')">Password is required (min 6 chars)</span>
        </div>

        <div class="login-actions">
          <button type="submit" class="login-btn">Log In</button>
          <a class="forgot-link" style="cursor: pointer;">Forget Password?</a>
        </div>
        
        <div class="mt-6 text-sm text-gray-600">
          Don't have an account? <a routerLink="/register" class="text-blue-500 hover:underline">Register here</a>
        </div>
      </form>
    </div>
  </div>
</section>

<style>
  .error-border { border-bottom: 2px solid #ff4d4f !important; }
  .error-msg { color: #ff4d4f; font-size: 11px; margin-top: 5px; display: block; }
  .error-alert { background: #fff1f0; border: 1px solid #ffccc7; color: #ff4d4f; padding: 10px; border-radius: 4px; margin-bottom: 20px; font-size: 14px; }
  .mt-6 { margin-top: 24px; }
</style>
