<section class="register-page">
  <div class="register-wrapper">
    <div class="register-left">
      <div class="register-image-placeholder">
        <div class="screen-card one"></div>
        <div class="screen-card two"></div>
        <div class="screen-card three"></div>
      </div>
    </div>

    <div class="register-right">
      <h1>Create an account</h1>
      <p class="register-subtitle">Enter your details below</p>

      <div class="error-alert" *ngIf="errorMessage">
        ⚠️ {{ errorMessage }}
      </div>

      <form class="register-form" [formGroup]="registerForm" (ngSubmit)="createAccount()">
        <div class="form-group">
          <input
            type="text"
            placeholder="Name *"
            formControlName="name"
            [class.error-border]="isInvalid('name')"
          />
          <span class="error-msg" *ngIf="isInvalid('name')">Name is required (min 2 chars)</span>
        </div>

        <div class="form-group">
          <input
            type="email"
            placeholder="Email *"
            formControlName="email"
            [class.error-border]="isInvalid('email')"
          />
          <span class="error-msg" *ngIf="isInvalid('email')">Please enter a valid email</span>
        </div>

        <div class="form-group">
          <input
            type="tel"
            placeholder="Phone Number *"
            formControlName="phone"
            [class.error-border]="isInvalid('phone')"
          />
          <span class="error-msg" *ngIf="isInvalid('phone')">A valid phone number is required (10-11 digits)</span>
        </div>

        <div class="form-group">
          <input
            type="password"
            placeholder="Password *"
            formControlName="password"
            [class.error-border]="isInvalid('password')"
          />
          <span class="error-msg" *ngIf="isInvalid('password')">Password must be at least 6 characters</span>
        </div>

        <div class="register-actions">
          <button type="submit" class="register-btn" [disabled]="loading">
            {{ loading ? 'Creating...' : 'Create Account' }}
          </button>
          
          <!-- Keep specific style for google button if not in CSS -->
          <button type="button" class="google-btn" style="width: 100%; border: 1px solid #bbb; background: transparent; padding: 15px; border-radius: 6px; cursor: pointer;">
            <span class="google-icon">G</span> Sign up with Google
          </button>
        </div>

        <div class="login-link-row">
          Already have account? <a routerLink="/login">Log in</a>
        </div>
      </form>
    </div>
  </div>
</section>

<style>
  .error-border { border-bottom: 2px solid #ff4d4f !important; }
  .error-msg { color: #ff4d4f; font-size: 11px; margin-top: 5px; display: block; }
  .error-alert { background: #fff1f0; border: 1px solid #ffccc7; color: #ff4d4f; padding: 10px; border-radius: 4px; margin-bottom: 20px; font-size: 14px; }
  .create-btn:disabled { opacity: 0.7; cursor: not-allowed; }
</style>
