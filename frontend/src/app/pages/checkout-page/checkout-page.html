<section class="checkout-page">
  <div class="breadcrumb">
    <span>Account</span> / <span>My Account</span> / <span>Product</span> / <span>View Cart</span> / <span class="active">CheckOut</span>
  </div>

  <h2>Billing Details</h2>

  <div class="checkout-container">
    <div class="billing-form">
      <div class="form-group">
        <label>First Name<span class="required">*</span></label>
        <input type="text" [(ngModel)]="firstName">
      </div>

      <div class="form-group">
        <label>Company Name</label>
        <input type="text" [(ngModel)]="companyName">
      </div>

      <div class="form-group">
        <label>Street Address<span class="required">*</span></label>
        <input type="text" [(ngModel)]="streetAddress">
      </div>

      <div class="form-group">
        <label>Apartment, floor, etc. (optional)</label>
        <input type="text" [(ngModel)]="apartment">
      </div>

      <div class="form-group">
        <label>Town / City<span class="required">*</span></label>
        <input type="text" [(ngModel)]="townCity">
      </div>

      <div class="form-group">
        <label>Phone Number<span class="required">*</span></label>
        <input type="tel" [(ngModel)]="phoneNumber">
      </div>

      <div class="form-group">
        <label>Email Address<span class="required">*</span></label>
        <input type="email" [(ngModel)]="emailAddress">
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="saveInfo">
        <label for="saveInfo">Save this information for faster check-out next time</label>
      </div>
    </div>

    <div class="order-summary-card">
      <div class="order-items">
        <div class="item-row" *ngFor="let item of orderItems">
          <div class="item-name">
            <span class="item-icon">{{ item.image }}</span>
            <span>{{ item.name }}</span>
          </div>
          <div class="item-price">${{ item.price * item.quantity }}</div>
        </div>
      </div>

      <div class="summary-totals">
        <div class="total-row">
          <span>Subtotal:</span>
          <span>${{ getSubtotal() }}</span>
        </div>
        <div class="total-row line">
          <span>Shipping:</span>
          <span>Free</span>
        </div>
        <div class="total-row final">
          <span>Total:</span>
          <span>${{ getSubtotal() }}</span>
        </div>
      </div>

      <div class="payment-methods">
        <div class="radio-group">
          <input type="radio" id="bank" name="payment" value="bank" [(ngModel)]="paymentMethod">
          <label for="bank">Bank</label>
          <div class="bank-icons" *ngIf="paymentMethod === 'bank'">
             <span class="fake-card">💳</span>
             <span class="fake-card">🏦</span>
          </div>
        </div>
        <div class="radio-group">
          <input type="radio" id="cash" name="payment" value="cash" [(ngModel)]="paymentMethod">
          <label for="cash">Cash on delivery</label>
        </div>
      </div>

      <div class="coupon-row">
        <input type="text" placeholder="Coupon Code">
        <button class="apply-btn">Apply Coupon</button>
      </div>

      <button class="place-order-btn" (click)="placeOrder()">Place Order</button>
    </div>
  </div>
</section>
