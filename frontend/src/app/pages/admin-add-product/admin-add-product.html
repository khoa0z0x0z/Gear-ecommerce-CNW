<section class="admin-dashboard-page">
  <app-admin-sidebar></app-admin-sidebar>

  <main class="admin-main">
    <section class="admin-content">

      <p class="back" (click)="cancel()">← Back to Products</p>

      <h2>{{ productId ? 'Edit Product' : 'Add New Product' }}</h2>
      <p class="sub">{{ productId ? 'Update details' : 'Fill in information' }}</p>

      <div class="form-card">
        <h3>Basic Information</h3>

        <div class="grid">
          <div class="form-group">
            <label>Product Name</label>
            <input placeholder="Enter product name" [(ngModel)]="product.name">
          </div>

          <div class="form-group">
            <label>Category</label>
            <select [(ngModel)]="product.categoryId">
              <option [value]="0" disabled>Select category</option>
              <option *ngFor="let cat of categories()" [value]="cat.id">{{ cat.name }}</option>
            </select>
          </div>

          <div class="form-group">
            <label>SKU</label>
            <input placeholder="Enter SKU" [(ngModel)]="product.sku">
          </div>

          <div class="form-group">
            <label>Price (VND)</label>
            <input type="number" placeholder="Enter price" [(ngModel)]="product.price">
          </div>

          <div class="form-group">
            <label>Stock Quantity</label>
            <input type="number" placeholder="Enter stock quantity" [(ngModel)]="product.stock">
          </div>
        </div>

        <div class="form-group" style="margin-top: 20px;">
          <label>Description</label>
          <textarea placeholder="Enter product description" [(ngModel)]="product.description"></textarea>
        </div>
      </div>

      <div class="form-card">
        <h3>Product Image</h3>
        <div class="form-group">
          <label>Image URL</label>
          <input placeholder="Paste image URL..." [(ngModel)]="product.image">
        </div>
        <div class="form-group" style="margin-top:12px;">
          <label>Or Upload Image</label>
          <input type="file" accept="image/*" (change)="onFileSelected($event)">
        </div>

        <div *ngIf="product.image" class="form-group" style="margin-top:12px;">
          <label>Preview</label>
          <img [src]="product.image" alt="Preview" style="max-width:200px; display:block;">
        </div>
      </div>

      <div class="btn-row">
        <button class="add-btn" (click)="submit()">{{ productId ? 'Save Changes' : 'Add Product' }}</button>
        <button class="cancel-btn" (click)="cancel()">Cancel</button>
      </div>

    </section>
  </main>

</section>
