<section class="cart-page">
  <div class="breadcrumb">Home / <span class="active">Cart</span></div>

  <div class="cart-container" *ngIf="cartItems().length > 0; else emptyCart">
    <!-- TABLE HEADER -->
    <div class="cart-header">
      <div class="col-product">Product</div>
      <div class="col-price">Price</div>
      <div class="col-qty">Quantity</div>
      <div class="col-subtotal">Subtotal</div>
    </div>

    <!-- DÒNG SẢN PHẨM -->
    <div class="cart-item-row" *ngFor="let item of cartItems()">
      <div class="col-product">
        <button class="remove-btn" (click)="removeItem(item.id)">×</button>
        <div class="product-icon">
          <img [src]="item.image" style="width: 40px; height: 40px; object-fit: contain;" *ngIf="item.image">
          <span *ngIf="!item.image">📦</span>
        </div>
        <span class="product-name">{{ item.name }}</span>
      </div>

      <div class="col-price">${{ item.price }}</div>

      <div class="col-qty">
        <div class="qty-control">
          <button (click)="decreaseQty(item)">-</button>
          <span>{{ item.quantity }}</span>
          <button (click)="increaseQty(item)">+</button>
        </div>
      </div>

      <div class="col-subtotal">${{ item.price * item.quantity }}</div>
    </div>

    <!-- NÚT RETURN SHOP -->
    <div class="cart-actions">
      <button class="outline-btn" routerLink="/">Return To Shop</button>
      <button class="outline-btn" (click)="cartItems()">Update Cart</button>
    </div>

    <!-- KHU VỰC TỔNG TIỀN VÀ MÃ GIẢM GIÁ -->
    <div class="cart-total-section">
      <div class="coupon-box">
        <input type="text" placeholder="Coupon Code">
        <button class="apply-btn">Apply Coupon</button>
      </div>

      <div class="total-box">
        <h3>Cart Total</h3>
        <div class="total-row"><span>Subtotal:</span><span>${{ totalPrice() }}</span></div>
        <div class="total-row"><span>Shipping:</span><span>Free</span></div>
        <div class="total-row final-total line"><span>Total:</span><span>${{ totalPrice() }}</span></div>
        <button class="checkout-btn" (click)="checkout()">Process to checkout</button>
      </div>
    </div>
  </div>

  <!-- TRẠNG THÁI TRỐNG GIỎ HÀNG -->
  <ng-template #emptyCart>
    <div class="empty-state">
      <div class="empty-icon">🛒</div>
      <h2>Your cart is empty</h2>
      <p>Looks like you haven't added anything to your cart yet.</p>
      <button class="checkout-btn" routerLink="/">Go Shopping Now</button>
    </div>
  </ng-template>
</section>
